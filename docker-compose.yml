services:
  postgres:
    image: postgres:16-alpine
    container_name: tense-lab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-tenselab}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tenselab}
      POSTGRES_DB: ${DB_NAME:-tenselab}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - tense-lab-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tenselab}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tense-lab-postgres-data:
